# Telegraf config snippet for ingesting wican-bridge MQTT into InfluxDB.
# Each ioniq5/<name> topic becomes a field named <name> in the "ioniq5"
# measurement. Depth-2 topics (ioniq5/journey/*, ioniq5/charge/*) are
# collapsed to <section>_<leaf> via a starlark processor.

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["ioniq5/+"]
  username = "wican"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf-ioniq5"
  qos = 0
  connection_timeout = "30s"
  data_format = "value"
  data_type = "float"
  name_override = "ioniq5"
  topic_tag = ""

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "ioniq5/+"
    tags = "_/field_name"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["ioniq5/+/+"]
  username = "wican"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf-ioniq5-deep"
  qos = 0
  connection_timeout = "30s"
  data_format = "value"
  data_type = "float"
  name_override = "ioniq5"
  topic_tag = ""

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "ioniq5/+/+"
    tags = "_/section/leaf"

[[processors.starlark]]
  namepass = ["ioniq5"]
  source = '''
def apply(metric):
    name = metric.tags.pop("field_name", None)
    if name == None:
        section = metric.tags.pop("section", None)
        leaf = metric.tags.pop("leaf", None)
        if section != None and leaf != None:
            name = section + "_" + leaf
    if name != None and "value" in metric.fields:
        metric.fields[name] = metric.fields.pop("value")
    return metric
'''
